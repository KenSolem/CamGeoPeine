<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cámara Georeferenciada Peine</title>
    <!-- Librería para estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para conversión de coordenadas a UTM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; }
        #video-container { position: relative; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="text-white font-sans relative">

    <div id="video-container">
        <!-- Stream de la cámara -->
        <video id="camera" autoplay playsinline></video>

        <!-- Recuadro en pantalla (UI) superior -->
        <div class="absolute top-4 left-4 right-4 bg-black bg-opacity-60 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-gray-700">
            <!-- Logos en pantalla -->
            <div class="flex justify-between items-center mb-3 border-b border-gray-600 pb-2">
                <img id="logo-zaldivar" src="logo-zaldivar.png" alt="Logo Zaldívar" class="h-10 object-contain" crossorigin="anonymous">
                <img id="logo-fch" src="logo-vector-fundacion-chile.webp" alt="Logo Fundación Chile" class="h-10 object-contain" crossorigin="anonymous">
            </div>
            
            <div class="text-sm font-bold text-white mb-2">Programa Agropecuario Peine</div>

            <!-- Datos GPS -->
            <div id="gps-data" class="text-xs font-mono flex flex-col gap-1 text-green-400">
                <span>Obteniendo coordenadas UTM...</span>
            </div>
        </div>

        <!-- Botón de Captura -->
        <div class="absolute bottom-10 left-0 right-0 flex justify-center items-center">
            <button id="capture-btn" class="bg-white rounded-full w-16 h-16 border-4 border-gray-400 focus:outline-none active:bg-gray-300 shadow-xl transition-all"></button>
        </div>
    </div>

    <!-- Canvas oculto -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('camera');
        const gpsDataElement = document.getElementById('gps-data');
        const captureBtn = document.getElementById('capture-btn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Variables globales para UTM
        let currentZone = 'N/A';
        let currentEasting = 'N/A';
        let currentNorthing = 'N/A';
        let currentAlt = 'N/A';

        // Inicializar la cámara solicitando alta resolución (1080p mínimo)
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 } 
                    } 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error de cámara: ", err);
                gpsDataElement.innerHTML = `<span class="text-red-400">Error de cámara o permisos.</span>`;
            }
        }

        // Obtener ubicación GPS y convertir a UTM
        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        currentAlt = position.coords.altitude ? position.coords.altitude.toFixed(1) + 'm' : 'N/A';
                        
                        // Calcular la zona UTM automáticamente según la longitud
                        const utmZone = Math.floor((lng + 180) / 6) + 1;
                        const isSouth = lat < 0;
                        currentZone = `${utmZone} ${isSouth ? 'S' : 'N'}`;

                        // Definir el sistema de coordenadas UTM para proj4
                        const utmProj = `+proj=utm +zone=${utmZone} ${isSouth ? '+south ' : ''}+datum=WGS84 +units=m +no_defs`;
                        
                        // Realizar la conversión matemática de EPSG:4326 (Lat/Lon) a UTM
                        const utmCoords = proj4('EPSG:4326', utmProj, [lng, lat]);
                        
                        // Guardar con 2 decimales
                        currentEasting = utmCoords[0].toFixed(2);
                        currentNorthing = utmCoords[1].toFixed(2);

                        const date = new Date().toLocaleString('es-CL');

                        // Mostrar en la interfaz web
                        gpsDataElement.innerHTML = `
                            <span>ZONA:  ${currentZone}</span>
                            <span>ESTE:  ${currentEasting} m</span>
                            <span>NORTE: ${currentNorthing} m</span>
                            <span>ALT:   ${currentAlt}</span>
                            <span class="text-white mt-1">FECHA: ${date}</span>
                        `;
                    },
                    (error) => {
                        gpsDataElement.innerHTML = `<span class="text-yellow-400">Buscando GPS...</span>`;
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        // Capturar foto y estampar datos en la esquina inferior derecha
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Configuraciones del recuadro (ajustado en altura para los datos UTM)
            const margin = 40;
            const boxWidth = 550;
            const boxHeight = 330; 
            const boxX = canvas.width - boxWidth - margin;
            const boxY = canvas.height - boxHeight - margin;

            // Dibujar fondo oscuro semitransparente
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

            // Título "Programa Agropecuario Peine"
            ctx.font = "bold 28px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("Programa Agropecuario Peine", boxX + 30, boxY + 50);

            // Coordenadas UTM
            ctx.font = "bold 24px monospace";
            ctx.fillStyle = "#4ade80"; // Verde
            ctx.fillText(`ZONA:  ${currentZone}`, boxX + 30, boxY + 95);
            ctx.fillText(`ESTE:  ${currentEasting} m`, boxX + 30, boxY + 130);
            ctx.fillText(`NORTE: ${currentNorthing} m`, boxX + 30, boxY + 165);
            ctx.fillText(`ALT:   ${currentAlt}`, boxX + 30, boxY + 200);
            
            // Fecha y hora
            ctx.fillStyle = "#ffffff";
            ctx.fillText(`FECHA: ${new Date().toLocaleString('es-CL')}`, boxX + 30, boxY + 235);

            // Dibujar logos
            const logoZaldivar = document.getElementById('logo-zaldivar');
            const logoFch = document.getElementById('logo-fch');

            function drawLogo(img, x, y, targetHeight) {
                if (img.complete && img.naturalHeight !== 0) {
                    const ratio = img.naturalWidth / img.naturalHeight;
                    const targetWidth = targetHeight * ratio;
                    ctx.drawImage(img, x, y, targetWidth, targetHeight);
                    return targetWidth;
                }
                return 0;
            }

            const logoHeight = 50; 
            const logoYPosition = boxY + 260; 
            
            const widthZaldivar = drawLogo(logoZaldivar, boxX + 30, logoYPosition, logoHeight);
            drawLogo(logoFch, boxX + 30 + widthZaldivar + 25, logoYPosition, logoHeight);

            // Descargar la imagen
            try {
                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = `Peine_Geo_${Date.now()}.jpg`;
                link.click();
            } catch (e) {
                alert("Error al guardar la imagen. Asegúrate de que los logos estén en tu GitHub.");
                console.error(e);
            }
        });

        initCamera();
        initGPS();
    </script>
</body>
</html>
